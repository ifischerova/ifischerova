name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository
# activity, which is what silenced the Lighthouse and Tests crons. This job
# checks weekly how stale the repo is and pushes a timestamp commit shortly
# before the limit, so the other schedules keep running on their own.

on:
  schedule:
    - cron: "0 5 * * 3" # weekly, Wednesday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    name: Refresh repository activity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push a timestamp if the repo is going stale
        run: |
          age=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit is $age day(s) old."
          if [ "$age" -lt 50 ]; then
            echo "Under the 50-day threshold — nothing to do."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keepalive: refresh scheduled workflow activity [skip ci]"
          git push
